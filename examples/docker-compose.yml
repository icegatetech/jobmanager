name: jobmanager

services:
  jobmanager.rustfs:
    image: rustfs/rustfs:1.0.0-beta.8
    container_name: jobmanager.rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
    hostname: rustfs
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
    volumes:
      - ./.tmp/rustfs_data:/data
  jobmanager.azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    container_name: jobmanager.azurite
    ports:
      - "10000:10000"
    # The emulator binds to loopback inside the container unless told otherwise, which the mapped
    # port cannot reach. `--skipApiVersionCheck` keeps it from refusing the REST version the SDK was
    # generated for, as `src/tests/common/azure_container.rs` explains at length.
    command: [ "azurite-blob", "--blobHost", "0.0.0.0", "--skipApiVersionCheck", "--location", "/data" ]
    volumes:
      - ./.tmp/azurite_data:/data
  jobmanager.storage-testbench:
    image: gcr.io/cloud-devrel-public-resources/storage-testbench:v0.63.0
    container_name: jobmanager.storage-testbench
    ports:
      - "9199:9000"
    # Built for linux/amd64 only, so on an arm64 host it runs under emulation - slower than the
    # other two, and still fast enough for an example.
    platform: linux/amd64
  jobmanager.init:
    image: amazon/aws-cli:2.35.15
    container_name: jobmanager.init
    depends_on:
      - jobmanager.rustfs
    environment:
      - AWS_ACCESS_KEY_ID=rustfsadmin
      - AWS_SECRET_ACCESS_KEY=rustfsadmin
      - AWS_REGION=us-east-1
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://rustfs:9000 s3 ls; do echo '...waiting for rustfs...' && sleep 1; done;
      aws --endpoint-url http://rustfs:9000 s3 mb s3://jobs || true;
      tail -f /dev/null
      "
