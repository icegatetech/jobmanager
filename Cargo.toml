[package]
name = "jobmanager"
version = "0.1.0"
edition = "2024"
rust-version = "1.92.0"
authors = ["IceGate Tech"]
license = "Apache-2.0"
repository = "https://github.com/icegatetech/jobmanager"
description = "Distributed job and task manager with S3-backed state"
readme = "README.md"
keywords = ["job", "task", "scheduler", "s3", "distributed"]
categories = ["asynchronous", "database"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_imports = "deny"
unused_variables = "deny"
dead_code = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "deny"
expect_used = "deny"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
single_match_else = "allow"
redundant_pub_crate = "allow"

[features]
# Off by default: `OtelMetrics` takes a `Meter` the caller owns, so anyone else would carry
# `opentelemetry` unused - or, on another pre-1.0 minor, carry a second copy of it.
default = []
# Records measurements through OpenTelemetry. Without it the crate still measures everything, it
# just needs a `MetricsSink` of the caller's own to record into.
metrics-otel = ["dep:opentelemetry"]

# This example doubles as its own test: `cargo test --example testing_your_executor` runs the
# assertions in its `tests` module, which is what keeps a "how to test" example honest. Declaring one
# example explicitly does not disable auto-discovery of the rest.
[[example]]
name = "testing_your_executor"
path = "examples/testing_your_executor.rs"
test = true

[dependencies]
# Error handling
thiserror = "2"

# Logging
tracing = "0.1"

# Async runtime
tokio = { version = "1.48.0", features = ["rt", "sync", "time", "macros", "signal"] }
tokio-util = "0.7"

# AWS S3. Default features are off to keep the SDK's legacy `rustls` connector out: it is the
# hyper 0.14 stack, unused here next to the hyper 1.x default client, and it drags along its own
# h2 0.3 and rustls 0.21 - the pair that kept turning up in `cargo audit`. The features listed are
# the rest of the SDK's own defaults.
aws-sdk-s3 = { version = "1.127", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-config = { version = "1.8", default-features = false, features = ["credentials-process", "default-https-client", "rt-tokio", "sso"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"

# Metrics. The SDK is deliberately absent: the crate records into a `Meter` the caller owns and
# never builds a provider itself.
opentelemetry = { version = "0.32.0", features = ["metrics"], optional = true }

# Utilities
uuid = { version = "1.19", features = ["v7", "v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9.2"
futures-util = "0.3"

# Concurrency
parking_lot = "0.12"
async-trait = "0.1"
dashmap = "6.1"

[dev-dependencies]
testcontainers = { version = "0.27", features = ["blocking"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "net", "process", "signal"] }

# Serves canned S3 responses to the SDK. A multi-object delete reports per-key failures inside a
# `200`, and no real store can be made to produce one on demand, so that response is scripted here.
aws-smithy-http-client = { version = "1.1", features = ["test-util"] }
aws-smithy-types = "1"
http = "1"
