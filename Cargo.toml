[package]
name = "jobmanager"
version = "0.1.0"
edition = "2024"
rust-version = "1.92.0"
authors = ["IceGate Tech"]
license = "Apache-2.0"
repository = "https://github.com/icegatetech/jobmanager"
description = "Distributed job and task manager with S3-backed state"
readme = "README.md"
keywords = ["job", "task", "scheduler", "s3", "distributed"]
categories = ["asynchronous", "database"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_imports = "deny"
unused_variables = "deny"
dead_code = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "deny"
expect_used = "deny"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
single_match_else = "allow"
redundant_pub_crate = "allow"

[dependencies]
# Error handling
thiserror = "2"

# Logging
tracing = "0.1"

# Async runtime
tokio = { version = "1.48.0", features = ["rt", "sync", "time", "macros"] }
tokio-util = "0.7"

# AWS S3
aws-sdk-s3 = "1.127"
aws-config = "1.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"

# Metrics
opentelemetry = { version = "0.31.0", features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.31.0", features = ["metrics", "trace", "rt-tokio"] }

# Utilities
uuid = { version = "1.19", features = ["v7", "v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9.2"
futures-util = "0.3"

# Concurrency
parking_lot = "0.12"
async-trait = "0.1"
dashmap = "6.1"

[dev-dependencies]
testcontainers = { version = "0.27", features = ["blocking"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "net", "process", "signal"] }
