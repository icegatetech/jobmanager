[dependencies]
# Error handling
thiserror = "2"

# Logging
tracing = "0.1"

# Async runtime
tokio = { version = "1.48.0", features = ["rt", "sync", "time", "macros", "signal"] }
tokio-util = "0.7"

# AWS S3. Default features are off to keep the SDK's legacy `rustls` connector out: it is the
# hyper 0.14 stack, unused here next to the hyper 1.x default client, and it drags along its own
# h2 0.3 and rustls 0.21 - the pair that kept turning up in `cargo audit`. The features listed are
# the rest of the SDK's own defaults.
#
# The floor is 1.146 rather than the oldest version this code compiles against: every SDK below it
# carries `lru` 0.16, the unsound `LruCache::pop()` of RUSTSEC-2026-0253. 1.146 is also what sets
# `rust-version` above - the SDK declares 1.94.1.
aws-sdk-s3 = { version = "1.146", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"], optional = true }
aws-config = { version = "1.8", default-features = false, features = ["credentials-process", "default-https-client", "rt-tokio", "sso"], optional = true }

# Azure Blob Storage. `hmac_rust` is on because the SDK carries no shared-key authentication, and
# `azure_core::hmac::hmac_sha256` behind that feature is what signs a request with the account key -
# see `storage/azure_signing.rs`. The feature pulls `hmac` and `sha2`, both already in the tree.
#
# Default features are off to leave out the SDK's gzip and deflate transports: its own clients build
# their HTTP client with automatic decompression disabled, so the codecs are dead weight - seven
# crates of `async-compression`, `flate2` and their checksum tails. The rest of the listed features
# are the SDK's own defaults. `tokio` among them adds no crate - it only makes the SDK spawn and
# sleep on the runtime this crate already runs on, where leaving it off would have it start an OS
# thread per task and block one to sleep.
azure_core = { version = "1.1", default-features = false, features = ["hmac_rust", "reqwest", "reqwest_rustls", "tokio"], optional = true }
azure_storage_blob = { version = "1.1", default-features = false, features = ["tokio"], optional = true }

# Google Cloud Storage. The JSON API client is written in `storage/gcs_client.rs`, so the only thing
# taken from Google's SDK is the authorization header: none of the four published clients survives
# the contract of `Storage` - see the invariant on what a call of `Storage` may cost in `AGENTS.md`.
google-cloud-auth = { version = "1.16", optional = true }
# The transport that client speaks over. Already in the tree through `azure_core`; named here because
# this crate's own code uses it. `rustls` rather than the platform's TLS for the reason the S3
# dependency gives, `json` for the metadata the JSON API answers with, `http2` because a pool of
# workers reaches one host on one connection. `charset` is left out: a state object is read as bytes
# and a metadata answer as JSON, so nothing here decodes a body by its declared charset.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2"], optional = true }
# Carries the header map `google-cloud-auth` hands back and the extensions map it takes.
http = { version = "1", optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"

# Metrics. The SDK is deliberately absent: the crate records into a `Meter` the caller owns and
# never builds a provider itself.
opentelemetry = { version = "0.32.0", features = ["metrics"], optional = true }

# Utilities
uuid = { version = "1.19", features = ["v7", "v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9.2"
futures-util = "0.3"

# Concurrency
parking_lot = "0.12"
async-trait = "0.1"
dashmap = "6.1"

[dev-dependencies]
testcontainers = { version = "0.27", features = ["blocking"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "net", "process", "signal"] }

# Serves canned S3 responses to the SDK. A multi-object delete reports per-key failures inside a
# `200`, and no real store can be made to produce one on demand, so that response is scripted here.
aws-smithy-http-client = { version = "1.1", features = ["test-util"] }
aws-smithy-types = "1"
http = "1"
