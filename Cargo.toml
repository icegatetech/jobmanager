[package]
name = "jobmanager"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["IceGate Tech"]
license = "Apache-2.0"
repository = "https://github.com/icegatetech/jobmanager"
description = "Distributed job and task manager coordinating workers through an object store"
readme = "README.md"
keywords = ["job", "task", "scheduler", "object-store", "distributed"]
categories = ["asynchronous", "database"]

# Every backend is behind a feature, and the crate docs carry an example per backend the build
# carries; without this docs.rs builds the default set, so a backend the default set leaves out
# would reach the rendered documentation with neither its configuration type nor its example.
[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_imports = "deny"
unused_variables = "deny"
dead_code = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "deny"
expect_used = "deny"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
single_match_else = "allow"
redundant_pub_crate = "allow"

[features]
# Keep `storage-s3` available when consumers do not select features explicitly. A build selecting
# no backend at all is refused - see the `compile_error!` in `src/lib.rs`.
default = ["storage-s3"]
# Off by default so consumers using another metrics sink do not carry OpenTelemetry.
metrics-otel = ["dep:opentelemetry"]
storage-s3 = ["dep:aws-sdk-s3", "dep:aws-config"]
storage-azure = ["dep:azure_core", "dep:azure_storage_blob"]
storage-gcs = ["dep:google-cloud-auth", "dep:reqwest", "dep:http"]

# This example doubles as its own test: `cargo test --example testing_your_executor` runs the
# assertions in its `tests` module, which is what keeps a "how to test" example honest. Declaring one
# example explicitly does not disable auto-discovery of the rest.
[[example]]
name = "testing_your_executor"
path = "examples/testing_your_executor.rs"
test = true

[[example]]
name = "adaptive_schedule"
required-features = ["storage-s3"]

[[example]]
name = "attempt_budget"
required-features = ["storage-s3"]

[[example]]
name = "chained_job"
required-features = ["storage-s3"]

[[example]]
name = "degraded_dependency"
required-features = ["storage-s3"]

[[example]]
name = "distributed_workers"
required-features = ["storage-s3"]

[[example]]
name = "fan_out_join"
required-features = ["storage-s3"]

[[example]]
name = "graceful_shutdown"
required-features = ["storage-s3"]

[[example]]
name = "idempotent_task"
required-features = ["storage-s3"]

[[example]]
name = "jobs_from_spec"
required-features = ["storage-s3"]

[[example]]
name = "json_model_job"
required-features = ["storage-s3"]

[[example]]
name = "observability"
required-features = ["storage-s3"]

[[example]]
name = "payload_by_reference"
required-features = ["storage-s3"]

[[example]]
name = "simple_job_s3"
required-features = ["storage-s3"]

[[example]]
name = "simple_job_azure"
required-features = ["storage-azure"]

[[example]]
name = "simple_job_gcs"
required-features = ["storage-gcs"]

[[example]]
name = "simple_job_cbor"
required-features = ["storage-s3"]

[[example]]
name = "simple_sequence_job"
required-features = ["storage-s3"]

[[example]]
